<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110F">
<title>PigSpin Steuerung</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#14110F}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#F4EDE6;-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer;color:#F4EDE6}
#app{max-width:430px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;background:#14110F}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 12px}
h1.logo{display:flex;align-items:center;gap:10px;font-size:30px;font-weight:800;letter-spacing:-0.03em;font-family:Montserrat,Poppins,Arial,sans-serif}h1.logo b{color:#FF6B2C;font-weight:800}
h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-0.01em}
.sub{font-size:13px;color:#B8A99B;margin-top:2px}
.chip{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:#2A2218;color:#FFB27F;font-size:12px;font-weight:600}
main{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:12px}
.card{background:#1F1A17;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.lbl{font-size:13px;font-weight:600;color:#B8A99B;letter-spacing:.04em;text-transform:uppercase}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.big{font-size:64px;font-weight:700;letter-spacing:-.03em;line-height:1}
.unit{font-size:24px;font-weight:500;color:#B8A99B}
.note{font-size:13px;color:#B8A99B;line-height:1.5}
.txt{font-size:14px;color:#D2C4B7;line-height:1.5}
.sq{width:44px;height:44px;border-radius:12px;border:0;background:#2B2420;font-size:20px}
.btn{min-width:44px;height:52px;border-radius:14px;border:0;background:#2B2420;font-size:16px;font-weight:600;padding:0 16px}
.on{background:#FF7A3D;color:#14110F}
.ok{background:#7AD9A3;color:#14110F}
.sel{background:#F4EDE6;color:#14110F}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bar{height:10px;border-radius:6px;background:#2B2420;overflow:hidden}
.bar>div{height:10px;border-radius:6px;background:#FF7A3D}
.track{position:relative;height:28px;border-radius:8px;background:#2B2420}
.track .f{position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:8px 0 0 8px;background:#FF7A3D}
.track .k{position:absolute;top:4px;bottom:4px;width:20px;border-radius:6px;background:#F4EDE6}
.scale{display:flex;justify-content:space-between;font-size:12px;color:#B8A99B}
.prog{display:flex;flex-direction:column;gap:8px;align-items:flex-start;width:100%;padding:18px;border-radius:20px;background:#1F1A17;border:2px solid transparent;text-align:left}
.prog.act{border-color:#7AD9A3}
.sysrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #2B2420;min-height:44px;font-size:15px}
.sysrow b{font-weight:600;text-align:right}
nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:8px 12px calc(14px + env(safe-area-inset-bottom));background:#1A1512;border-top:1px solid #2B2420}
nav button{height:48px;border-radius:14px;border:0;background:transparent;color:#B8A99B;font-size:14px;font-weight:600}
nav button.cur{background:#2B2420;color:#FF9A66}
.sw{-webkit-appearance:none;appearance:none;display:block;width:100%;height:60px;margin:0;padding:0 6px;border-radius:30px;background:#2B2420;cursor:pointer}
.sw.on{background:#FF7A3D}
.sw::-webkit-slider-runnable-track{height:60px;background:transparent}
.sw::-webkit-slider-thumb{-webkit-appearance:none;width:48px;height:48px;margin-top:6px;border-radius:50%;background:#F4EDE6;border:0;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.sw::-moz-range-track{height:60px;background:transparent}
.sw::-moz-range-thumb{width:48px;height:48px;border-radius:50%;background:#F4EDE6;border:0}
input[type=range]:not(.sw){accent-color:#FF7A3D;width:100%;height:32px;margin:0}
button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid #FF9A66;outline-offset:2px}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  var OFFSET = 350; // Platzhalter: Abstand Brenner bis Spießmitte bei eingefahrenem Antrieb (mm), aus dem 3D-Modell zu übernehmen
  var PROGRAMS = [
    {id:'anbraten',name:'Anbraten',tag:'Start',tagc:'#FFB27F',dist:250,desc:'Nahe an der Flamme, damit die Haut anzieht.'},
    {id:'garen',name:'Garen',tag:'Hauptphase',tagc:'#7AD9A3',dist:450,desc:'Mit Abstand zur Flamme, das Fleisch gart gleichmäßig durch.'},
    {id:'knusprig',name:'Knusprig',tag:'Zum Schluss',tagc:'#FFB27F',dist:220,desc:'Am Ende wieder nah an die Flamme für die knusprige Kruste.'}
  ];
  var s = {welcome:true,started:false,pigD:300,tab:'grill',burnerOn:false,hub:300,hubTarget:null,spin:true,speed:2,target:82,program:'',simSpeed:1,phase:'run',angle:0};
  var core = 20, hist = [20], dir = 1;
  var STAGES = [
    {body:'#F2A5B5',acc:'#E88CA0',leg:'#D9798F',belly:'#E693A6',hi:'#F9C6D1',sn:'#F4A9B8',ch:'#F28FA3',ear:'#F8BCC8',dk:'#5E3A47',dk2:'#6E4552'},
    {body:'#E8821E',acc:'#C4601A',leg:'#A84E14',belly:'#C96A18',hi:'#F5A94A',sn:'#F09A3C',ch:'#D9701C',ear:'#F2B05E',dk:'#3A2113',dk2:'#4A2A18'},
    {body:'#A24A12',acc:'#7E3A0E',leg:'#6A300B',belly:'#8A400F',hi:'#C97A32',sn:'#B86320',ch:'#92450F',ear:'#BF7432',dk:'#2A170C',dk2:'#34200F'}
  ];
  function mixHex(a,b,k){
    var r='#';
    for(var i=1;i<7;i+=2){
      var x=parseInt(a.substr(i,2),16), y=parseInt(b.substr(i,2),16), v=Math.round(x+(y-x)*k);
      r+=('0'+v.toString(16)).slice(-2);
    }
    return r;
  }
  function pal(p){
    p = clamp(p,0,1.5);
    var i = p<=1 ? 0 : 1, k = p<=1 ? p : (p-1)/0.5, out = {};
    Object.keys(STAGES[0]).forEach(function(key){ out[key] = mixHex(STAGES[i][key],STAGES[i+1][key],k); });
    return out;
  }
  function pigProg(){
    return core<=s.target ? clamp((core-20)/(s.target-20),0,1) : 1+clamp((core-s.target)/24,0,0.5);
  }
  function yOf(c){ return 64-(clamp(c,20,100)-20)/80*56; }
  function spark(){
    var n=hist.length, pts=[];
    if(n<2){ pts=['0,'+yOf(hist[0]).toFixed(1),'320,'+yOf(hist[0]).toFixed(1)]; }
    else { for(var i=0;i<n;i++){ pts.push((i/(n-1)*320).toFixed(1)+','+yOf(hist[i]).toFixed(1)); } }
    return {pts:pts.join(' '), x:320, y:yOf(hist[n-1]).toFixed(1)};
  }
  function topView(){
    var d=s.pigD, r=d/2, y=OFFSET+s.hub, c=pal(pigProg()), skin=y-r, f=clamp(d,200,400)/300;
    var o='<svg viewBox="-30 -90 1410 1040" width="100%" role="img" aria-label="Draufsicht auf den Griller mit Ferkel, Abstand zwischen Flamme und Haut '+skin+' mm" style="display:block">';
    o+='<rect x="0" y="0" width="1350" height="900" rx="30" fill="#1A1512" stroke="#5A4C42" stroke-width="10"/>';
    o+='<rect x="120" y="40" width="1110" height="820" rx="20" fill="#2B2420"/>';
    o+='<rect x="100" y="-62" width="1150" height="62" rx="14" fill="'+(s.burnerOn?'#FF7A3D':'#5A4C42')+'"/>';
    o+='<text x="675" y="-16" text-anchor="middle" font-size="44" font-weight="700" fill="'+(s.burnerOn?'#14110F':'#D2C4B7')+'">Brenner</text>';
    if(s.burnerOn){ for(var x=170;x<=1180;x+=100){ o+='<path d="M'+(x-28)+',4 Q'+x+',120 '+(x+28)+',4 Z" fill="#FFC857"/><path d="M'+(x-14)+',4 Q'+x+',60 '+(x+14)+',4 Z" fill="#FFF1B8"/>'; } }
    [38,1312].forEach(function(x){ o+='<rect x="'+(x-10)+'" y="'+OFFSET+'" width="20" height="300" rx="6" fill="#4A3F38"/><rect x="'+(x-30)+'" y="'+(y-34)+'" width="60" height="68" rx="10" fill="#F4EDE6"/>'; });
    o+='<rect x="60" y="'+(y-9)+'" width="1230" height="18" rx="7" fill="#B8A99B"/>';
    o+='<path d="M1055,'+y+' q70,-10 40,-70 q-30,-40 -55,5" fill="none" stroke="'+c.acc+'" stroke-width="16" stroke-linecap="round"/>';
    o+='<ellipse cx="700" cy="'+y+'" rx="365" ry="'+r+'" fill="'+c.body+'"/>';
    o+='<ellipse cx="690" cy="'+(y-r*0.35)+'" rx="300" ry="'+(r*0.22)+'" fill="'+c.hi+'" opacity=".7"/>';
    o+='<ellipse cx="690" cy="'+(y+r*0.45)+'" rx="320" ry="'+(r*0.3)+'" fill="'+c.belly+'" opacity=".55"/>';
    var hx=330, hy=y;
    o+='<ellipse cx="'+(hx+40)+'" cy="'+(hy-72*f)+'" rx="44" ry="'+(34*f)+'" fill="'+c.acc+'"/><ellipse cx="'+(hx+40)+'" cy="'+(hy+72*f)+'" rx="44" ry="'+(34*f)+'" fill="'+c.acc+'"/>';
    o+='<ellipse cx="'+hx+'" cy="'+hy+'" rx="'+(105*f)+'" ry="'+(80*f)+'" fill="'+c.body+'"/>';
    o+='<ellipse cx="'+(hx-105*f-20)+'" cy="'+hy+'" rx="'+(50*f)+'" ry="'+(40*f)+'" fill="'+c.acc+'"/><ellipse cx="'+(hx-105*f-40*f-8)+'" cy="'+hy+'" rx="'+(14*f)+'" ry="'+(30*f)+'" fill="'+c.sn+'"/>';
    o+='<circle cx="'+(hx-105*f-24)+'" cy="'+(hy-14*f)+'" r="'+(7*f)+'" fill="'+c.dk+'"/><circle cx="'+(hx-105*f-24)+'" cy="'+(hy+14*f)+'" r="'+(7*f)+'" fill="'+c.dk+'"/>';
    o+='<circle cx="'+(hx-40*f)+'" cy="'+(hy-58*f)+'" r="'+(11*f)+'" fill="'+c.dk+'"/><circle cx="'+(hx-40*f)+'" cy="'+(hy+58*f)+'" r="'+(11*f)+'" fill="'+c.dk+'"/>';
    var ty=y-r;
    o+='<g stroke="#F4EDE6" stroke-width="7"><line x1="700" y1="8" x2="700" y2="'+(ty-8)+'"/><line x1="676" y1="8" x2="724" y2="8"/><line x1="676" y1="'+(ty-8)+'" x2="724" y2="'+(ty-8)+'"/></g>';
    o+='<text x="740" y="'+(ty/2+20)+'" font-size="60" font-weight="700" fill="#F4EDE6">'+skin+' mm</text>';
    o+='<text x="675" y="945" text-anchor="middle" font-size="40" fill="#B8A99B">vorne</text>';
    return o+'</svg>';
  }
  function progTarget(id){ var p = PROGRAMS.filter(function(x){return x.id===id;})[0]; return clamp(p.dist - OFFSET + s.pigD/2, 0, 300); }
  function updateLive(){
    var hd=document.getElementById('pigHead'); if(hd) hd.innerHTML = pigSvg(300,140,76,false,pigProg());
    var tv=document.getElementById('topView'); if(tv) tv.innerHTML = topView();
    var sl=document.getElementById('simSl'); if(sl && document.activeElement!==sl) sl.value=core;
    var st=document.getElementById('simTxt'); if(st) st.textContent=core.toFixed(1).replace('.',',')+' °C';
    var ct=document.getElementById('coreTxt'); if(!ct) return;
    ct.textContent = core.toFixed(1).replace('.',',');
    var cb=document.getElementById('coreBar'); if(cb) cb.style.width = Math.round(clamp(core/s.target,0,1)*100)+'%';
    var sp=spark();
    document.getElementById('spark').setAttribute('points',sp.pts);
    var d=document.getElementById('sparkDot'); d.setAttribute('cy',sp.y);
  }
  function pigSvg(d,w,h,dim,pp){
    var c = pal(pp===undefined?1:pp);
    var f = clamp(d,200,400)/300;
    var ry = 15*f, cy = 41-ry, rx = 26*(0.9+0.1*f), top = 41-2*ry, k = rx/26;
    var tdx = 38-rx-12, tdy = cy-26;
    var o = '<svg viewBox="0 0 92 50" width="'+w+'"'+(h?' height="'+h+'"':'')+' role="img" aria-label="Ferkel in Seitenansicht, Kopf nach links, Durchmesser '+d+' mm" style="flex-shrink:0;max-width:100%"><g transform="translate(92 0) scale(-1 1)">';
    o += '<path transform="translate('+tdx+' '+tdy+')" d="M13 22 q-7 -3 -4 -9 q3 -4 6 0 q1 2 -1 3" fill="none" stroke="'+c.acc+'" stroke-width="2.4" stroke-linecap="round"/>';
    o += '<rect x="19" y="36" width="7" height="9" rx="2.5" fill="'+c.leg+'"/><rect x="19" y="43" width="7" height="3.5" rx="1.5" fill="'+c.dk+'"/>';
    o += '<rect x="45" y="36" width="7" height="9" rx="2.5" fill="'+c.leg+'"/><rect x="45" y="43" width="7" height="3.5" rx="1.5" fill="'+c.dk+'"/>';
    o += '<ellipse cx="38" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="'+c.body+'"/>';
    o += '<ellipse cx="38" cy="35" rx="'+(22*k)+'" ry="6" fill="'+c.belly+'" opacity=".7"/>';
    o += '<ellipse cx="36" cy="'+(top+7)+'" rx="'+(15*k)+'" ry="3.2" fill="'+c.hi+'" opacity=".8"/>';
    o += '<path transform="translate(0 '+tdy+')" d="M28 24 q4 -3 8 0" fill="none" stroke="'+c.belly+'" stroke-width="1" stroke-linecap="round"/>';
    o += '<rect x="28" y="36" width="7" height="9" rx="2.5" fill="'+c.body+'"/><rect x="28" y="43" width="7" height="3.5" rx="1.5" fill="'+c.dk2+'"/>';
    o += '<rect x="55" y="36" width="7" height="9" rx="2.5" fill="'+c.body+'"/><rect x="55" y="43" width="7" height="3.5" rx="1.5" fill="'+c.dk2+'"/>';
    o += '<g transform="translate(56 38.5) scale('+f+') translate(-56 -38.5)">';
    o += '<ellipse cx="63" cy="28" rx="11.5" ry="10.5" fill="'+c.body+'"/>';
    o += '<circle cx="62" cy="32" r="3.4" fill="'+c.ch+'" opacity=".75"/>';
    o += '<path d="M54 21 L62 11 L67 22 Z" fill="'+c.acc+'"/><path d="M57 21 L62 15 L64.5 21.5 Z" fill="'+c.ear+'"/>';
    o += '<rect x="68" y="24.5" width="12.5" height="10" rx="5" fill="'+c.acc+'"/><ellipse cx="76" cy="29.5" rx="4" ry="4.5" fill="'+c.sn+'"/>';
    o += '<ellipse cx="75" cy="28.5" rx="1.2" ry="1.6" fill="'+c.dk+'"/><ellipse cx="78.6" cy="28.5" rx="1.2" ry="1.6" fill="'+c.dk+'"/>';
    o += '<path d="M66 35.2 q4.5 2.6 9 .2" fill="none" stroke="'+c.dk+'" stroke-width="1.2" stroke-linecap="round"/>';
    o += '<circle cx="66" cy="25" r="2.3" fill="#FFFFFF"/><circle cx="66.3" cy="25.2" r="1.5" fill="#14110F"/><circle cx="66.8" cy="24.6" r=".5" fill="#FFFFFF"/>';
    o += '<path d="M63 21.5 q3 -2 6 -.5" fill="none" stroke="'+c.dk+'" stroke-width="1" stroke-linecap="round"/></g>';
    if (dim) o += '<g stroke="#F4EDE6" stroke-width=".7" opacity=".85"><line x1="38" y1="'+top+'" x2="38" y2="41" stroke-dasharray="1.6 1.2"/><line x1="35.5" y1="'+top+'" x2="40.5" y2="'+top+'"/><line x1="35.5" y1="41" x2="40.5" y2="41"/></g>';
    return o + '</g></svg>';
  }
  var app = document.getElementById('app');
  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');}

  function setupView(){
        return '<div class="card" style="flex:1;min-height:0;gap:16px">'
      +'<div style="font-size:20px;font-weight:700">Ferkel einstellen</div>'
      +'<div class="txt">Gib den ungefähren Durchmesser an der dicksten Stelle ein. Die Steuerung rechnet damit den echten Abstand von der Flamme zur Haut aus.</div>'
      +'<div style="flex:1;display:flex;align-items:center;justify-content:center">'+pigSvg(s.pigD,300,163,true)+'</div>'
      +'<div class="row"><button class="sq" style="width:56px;height:56px;font-size:24px" data-a="pigdn" aria-label="Durchmesser verkleinern">−</button>'
      +'<div style="font-size:40px;font-weight:700;letter-spacing:-.02em">Ø '+s.pigD+' mm</div>'
      +'<button class="sq" style="width:56px;height:56px;font-size:24px" data-a="pigup" aria-label="Durchmesser vergrößern">+</button></div>'
      +'<button class="btn on" style="height:56px;font-size:17px;font-weight:700" data-a="start">Übernehmen und weiter</button></div>';
  }

  function grillView(){
    var radius = s.pigD/2, skin = OFFSET + s.hub - radius;
    var prog = Math.round(clamp(core/s.target,0,1)*100);
    var sp = spark(), ty = yOf(s.target);
    var h = '';
    h += '<div class="card"><div class="row"><div class="lbl">Kerntemperatur</div><div style="display:flex;align-items:center;gap:8px">'
      +'<button class="sq" data-a="tdn" aria-label="Zieltemperatur senken">−</button><div class="note" style="min-width:70px;text-align:center">Ziel '+s.target+' °C</div><button class="sq" data-a="tup" aria-label="Zieltemperatur erhöhen">+</button></div></div>'
      +'<div style="display:flex;align-items:baseline;gap:6px"><div class="big" id="coreTxt">'+core.toFixed(1).replace('.',',')+'</div><div class="unit">°C</div></div>'
      +'<div class="bar"><div id="coreBar" style="width:'+prog+'%"></div></div>'
      +'<svg viewBox="0 0 320 70" width="100%" height="70" role="img" aria-label="Verlauf der Kerntemperatur seit dem Start" style="display:block"><line id="sparkT" x1="0" y1="'+ty.toFixed(1)+'" x2="320" y2="'+ty.toFixed(1)+'" stroke="#5A4C42" stroke-width="1" stroke-dasharray="4 4"/><polyline id="spark" points="'+sp.pts+'" fill="none" stroke="#FF7A3D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle id="sparkDot" cx="'+sp.x+'" cy="'+sp.y+'" r="5" fill="#FF7A3D"/></svg>'
      +'<div class="scale"><span>Start</span><span>Zieltemperatur</span><span>jetzt</span></div></div>';
    h += '<div class="card"><div class="row"><div class="lbl">Gasbrenner</div><div style="font-size:32px;font-weight:700;letter-spacing:-.02em">'+(s.burnerOn?'An':'Aus')+'</div></div>'
      +'<input type="range" id="burnerSw" class="sw'+(s.burnerOn?' on':'')+'" min="0" max="1" step="1" value="'+(s.burnerOn?1:0)+'" aria-label="Gasbrenner, links Aus, rechts An">'
      +'<div class="scale" style="font-size:14px;font-weight:600"><span>← Aus</span><span>An →</span></div>'
      +'<div class="note">Schieber nach rechts: Brenner an. Nach links: Brenner aus. Die Hitze am Ferkel stellst du über den Abstand zur Flamme ein.</div></div>';
    h += '<div class="card"><div class="row" style="align-items:baseline"><div class="lbl">Abstand Flamme → Haut</div><div style="font-size:24px;font-weight:700">'+skin+' mm</div></div>'
      +'<div id="topView">'+topView()+'</div>'
      +'<div class="note">Draufsicht. Spießmitte '+(OFFSET+s.hub)+' mm − Ferkelradius '+radius+' mm. Der Antrieb steht bei '+s.hub+' mm Hub, beide Antriebe sind gekoppelt.</div>'
      +'<div class="grid2"><button class="btn" data-a="closer"'+(s.phase!=='run'?' disabled':'')+'>← Näher</button><button class="btn" data-a="farther"'+((s.phase==='finish'||s.phase==='move'||s.hub>=300)?' disabled':'')+'>Weiter →</button></div>'
      +'<div class="row"><div class="txt">Ferkel Ø '+s.pigD+' mm</div><button class="btn" style="height:44px;font-size:14px" data-a="setup">Ändern</button></div></div>';
    var sp = '';
    [1,2,3].forEach(function(v){ sp += '<button class="btn'+(s.speed===v?' sel':'')+'" style="height:48px;font-size:14px;padding:0" data-a="speed" data-v="'+v+'">'+v+' U/min</button>'; });
    var spinTxt = s.phase==='run' ? s.speed+' U/min' : s.phase==='finish' ? 'Fährt weg …' : s.phase==='move' ? 'Fährt in Endlage …' : 'Entnahmeposition';
    var busy = s.phase==='finish' || s.phase==='move';
    h += '<div class="card"><div class="row"><div><div class="lbl">Drehspieß</div><div style="font-size:20px;font-weight:700">'+spinTxt+'</div></div>'
      +'<button class="btn'+(s.phase==='parked'?' ok':'')+'" style="min-width:112px;height:48px;font-weight:700;font-size:15px" data-a="spin"'+(busy?' disabled':'')+'>'+(s.phase==='run'?'Stopp':busy?'Stopp läuft':'Start')+'</button></div><div class="grid3">'+sp+'</div>'
      +'<div class="note">Mit „Stopp“ dreht der Spieß die laufende Umdrehung fertig, fährt ganz weg vom Brenner und bleibt dort stehen. So kannst du ihn herausnehmen.</div>'
      +(s.phase==='parked'?'<div class="note" style="color:#7AD9A3;font-weight:600">Der Spieß steht in der äußersten Endlage und kann entnommen werden.</div>':'')+'</div>';
    h += '<div class="note" style="text-align:center;padding:0 8px 4px">Der Not-Aus am Schaltschrank bleibt immer der Hardware-Taster. Bricht die Verbindung ab, schließt das Gasventil.</div>';
    return h;
  }

  function progView(){
    var radius = s.pigD/2;
    var h = '<div class="txt" style="font-size:15px;padding:4px 4px 0">Ein Programm schaltet den Brenner ein und fährt den Spieß so, dass die Haut den gewünschten Abstand zur Flamme hat. Die Größe des Ferkels ist dabei eingerechnet.</div>';
    PROGRAMS.forEach(function(p){
      var act = s.program===p.id;
      h += '<button class="prog'+(act?' act':'')+'" data-a="prog" data-v="'+p.id+'"><div class="row" style="width:100%"><div style="font-size:18px;font-weight:700">'+p.name+'</div>'
        +'<div style="font-size:13px;font-weight:600;color:'+(act?'#7AD9A3':p.tagc)+'">'+(act?'Aktiv':p.tag)+'</div></div>'
        +'<div class="txt">'+p.desc+'</div><div class="note">Brenner an · Abstand zur Haut '+p.dist+' mm</div></button>';
    });
    return h;
  }

  function sysView(){
    var rows = [
      ['Verbindung','Demo-Modus','#FFB27F'],
      ['Steuerung','Raspberry Pi 5','#F4EDE6'],
      ['Not-Aus Schaltschrank','Nicht gedrückt','#7AD9A3'],
      ['Gasventil',s.burnerOn?'Offen':'Geschlossen',s.burnerOn?'#FFB27F':'#7AD9A3'],
      ['Kernthermometer','Bluetooth, Akku 84 %','#7AD9A3'],
      ['Drehspieß',s.phase==='run'?'Dreht, '+s.speed+' U/min':s.phase==='parked'?'Entnahmeposition':'Fährt in Endlage','#F4EDE6'],
      ['Antrieb links',s.hub+' mm','#F4EDE6'],
      ['Antrieb rechts',s.hub+' mm','#F4EDE6'],
      ['Antriebsspannung','24 V','#F4EDE6']
    ];
    var h = '<div class="card" style="padding:6px 18px;gap:0">';
    rows.forEach(function(r){ h += '<div class="sysrow"><span>'+r[0]+'</span><b style="color:'+r[2]+'">'+r[1]+'</b></div>'; });
    h += '</div><div class="card" style="gap:8px"><div style="font-size:15px;font-weight:700">Sicherer Zustand</div><div class="txt">Bricht die Verbindung zum Handy ab, schließt das Gasventil, der Brenner geht aus und die Antriebe bleiben stehen. Der Not-Aus am Schaltschrank wirkt unabhängig von dieser Oberfläche.</div></div>'
      +'<div class="card" style="gap:12px"><div style="font-size:15px;font-weight:700">Demo-Simulation</div>'
      +'<div class="txt">Diese Seite zeigt den Entwurf mit Beispielwerten und steuert keinen echten Griller. Die Kerntemperatur steigt hier nur simuliert, und das Ferkel oben färbt sich mit. Mit dem Schieber stellst du die Temperatur selbst ein, mit den Knöpfen änderst du die Geschwindigkeit.</div>'
      +'<div class="row"><div class="lbl">Kerntemperatur</div><div id="simTxt" style="font-size:20px;font-weight:700">'+core.toFixed(1).replace('.',',')+' °C</div></div>'
      +'<input type="range" id="simSl" min="20" max="100" step="0.5" value="'+core+'" aria-label="Kerntemperatur für die Simulation einstellen">'
      +'<div class="scale"><span>20 °C</span><span>Ziel '+s.target+' °C</span><span>100 °C</span></div>'
      +'<div class="grid3">'+[1,5,20].map(function(v){return '<button class="btn'+(s.simSpeed===v?' sel':'')+'" style="height:48px;font-size:14px;padding:0" data-a="simspeed" data-v="'+v+'">'+v+'×</button>';}).join('')+'</div>'
      +'<button class="btn" data-a="simreset">Zurück auf 20 °C (roh)</button>'
      +'<div class="note">Der Brenner muss an sein, damit die Temperatur steigt. Die Programmwerte und der Abstand von Brenner zu Spießmitte sind Platzhalter.</div></div>';
    return h;
  }

  function welcomeView(){
    return '<div style="min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:32px 24px;text-align:center">'
      +'<div style="font-size:clamp(28px,10.5vw,52px);white-space:nowrap;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#B8A99B">Welcome to</div>'
      +'<svg viewBox="0 0 500 500" width="300" height="300" aria-hidden="true"><circle cx="250" cy="250" r="230" fill="#232844"/><path d="M298.7 68.4 A188 188 0 1 1 73.3 185.7" fill="none" stroke="#FF6B2C" stroke-width="22" stroke-linecap="round"/><polygon points="88.4,144.4 41.4,174.1 105.3,197.3" fill="#FF6B2C"/><polygon points="148,205 158,128 228,176" fill="#F7A8B8"/><polygon points="352,205 342,128 272,176" fill="#F7A8B8"/><polygon points="162,190 167,148 204,176" fill="#E47E95"/><polygon points="338,190 333,148 296,176" fill="#E47E95"/><ellipse cx="250" cy="262" rx="108" ry="100" fill="#FFB9C8"/><ellipse cx="250" cy="298" rx="50" ry="36" fill="#F48CA5"/><ellipse cx="232" cy="298" rx="8" ry="13" fill="#14182B"/><ellipse cx="268" cy="298" rx="8" ry="13" fill="#14182B"/><circle cx="208" cy="237" r="11" fill="#14182B"/><circle cx="292" cy="237" r="11" fill="#14182B"/><circle cx="211" cy="233" r="3.5" fill="#fff"/><circle cx="295" cy="233" r="3.5" fill="#fff"/></svg>'
      +'<div style="font-family:Montserrat,Poppins,Arial,sans-serif;font-size:76px;font-weight:800;letter-spacing:-0.03em;color:#F4EDE6">Pig<span style="color:#FF6B2C">Spin</span></div>'
      +'<button class="btn ok" style="margin-top:28px;min-width:280px;height:72px;font-size:24px;font-weight:700" data-a="enter">Los geht\u2019s</button></div>';
  }
  function render(){
    if(s.welcome){ app.innerHTML = welcomeView(); return; }
    var body = !s.started ? setupView() : (s.tab==='grill'?grillView():s.tab==='prog'?progView():sysView());
    var nav = '';
    if (s.started) {
      [['grill','Grillen'],['prog','Programme'],['sys','System']].forEach(function(t){
        nav += '<button class="'+(s.tab===t[0]?'cur':'')+'" data-a="tab" data-v="'+t[0]+'">'+t[1]+'</button>';
      });
      nav = '<nav>'+nav+'</nav>';
    }
    var status = (s.burnerOn?'Brenner läuft':'Brenner aus')+' · Spieß '+(s.spin?'dreht':'steht');
    var keep = app.querySelector('main') ? app.querySelector('main').scrollTop : 0;
    app.innerHTML = '<header><div><h1 class="logo" aria-label="PigSpin"><svg viewBox="0 0 500 500" width="46" height="46" aria-hidden="true" style="flex-shrink:0"><circle cx="250" cy="250" r="230" fill="#232844"/><path d="M298.7 68.4 A188 188 0 1 1 73.3 185.7" fill="none" stroke="#FF6B2C" stroke-width="22" stroke-linecap="round"/><polygon points="88.4,144.4 41.4,174.1 105.3,197.3" fill="#FF6B2C"/><polygon points="148,205 158,128 228,176" fill="#F7A8B8"/><polygon points="352,205 342,128 272,176" fill="#F7A8B8"/><polygon points="162,190 167,148 204,176" fill="#E47E95"/><polygon points="338,190 333,148 296,176" fill="#E47E95"/><ellipse cx="250" cy="262" rx="108" ry="100" fill="#FFB9C8"/><ellipse cx="250" cy="298" rx="50" ry="36" fill="#F48CA5"/><ellipse cx="232" cy="298" rx="8" ry="13" fill="#14182B"/><ellipse cx="268" cy="298" rx="8" ry="13" fill="#14182B"/><circle cx="208" cy="237" r="11" fill="#14182B"/><circle cx="292" cy="237" r="11" fill="#14182B"/><circle cx="211" cy="233" r="3.5" fill="#fff"/><circle cx="295" cy="233" r="3.5" fill="#fff"/></svg><span>Pig<b>Spin</b></span></h1><div class="sub">'+status+'</div></div><div id="pigHead" style="flex-shrink:0">'+pigSvg(300,140,76,false,pigProg())+'</div></header><main>'+body+'</main>'+nav;
    var m = app.querySelector('main'); if (m) m.scrollTop = keep;
  }

  app.addEventListener('click', function(e){
    var b = e.target.closest('button[data-a]'); if(!b) return;
    var a = b.getAttribute('data-a'), v = b.getAttribute('data-v');
    if(a==='pigdn'){ s.pigD = clamp(s.pigD-10,200,400); s.program=''; }
    else if(a==='pigup'){ s.pigD = clamp(s.pigD+10,200,400); s.program=''; }
    else if(a==='enter'){ s.welcome=false; }
    else if(a==='start'){ s.started=true; s.tab='grill'; }
    else if(a==='setup'){ s.started=false; }
    else if(a==='tdn'){ s.target = clamp(s.target-1,60,95); }
    else if(a==='tup'){ s.target = clamp(s.target+1,60,95); }
    else if(a==='burner'){ s.burnerOn = !s.burnerOn; }
    else if(a==='closer'){ if(s.phase==='run'){ s.hubTarget=null; s.hub = clamp(s.hub-20,0,300); s.program=''; } }
    else if(a==='farther'){ if(s.phase==='run'||s.phase==='parked'){ s.hubTarget=null; s.hub = clamp(s.hub+20,0,300); s.program=''; } }
    else if(a==='spin'){ if(s.phase==='run'){ s.phase='finish'; } else if(s.phase==='parked'){ s.phase='run'; s.spin=true; } }
    else if(a==='speed'){ s.speed = Number(v); }
    else if(a==='tab'){ s.tab = v; }
    else if(a==='simspeed'){ s.simSpeed = Number(v); }
    else if(a==='simreset'){ core = 20; hist = [20]; dir = 1; }
    else if(a==='prog'){
      var p = PROGRAMS.filter(function(x){return x.id===v;})[0];
      if(s.phase==='finish'||s.phase==='move'){ s.tab='grill'; }
      else { s.program = p.id; s.hubTarget = progTarget(p.id); s.burnerOn = true; s.phase='run'; s.spin=true; s.tab='grill'; }
    }
    render();
  });
  app.addEventListener('input', function(e){
    if(e.target && e.target.id==='simSl'){ core = Number(e.target.value); hist.push(core); if(hist.length>240) hist.shift(); updateLive(); }
  });
  app.addEventListener('change', function(e){
    if(e.target && e.target.id==='burnerSw'){
      s.burnerOn = e.target.value==='1';
      if(s.burnerOn){ if(s.phase==='parked'){ s.phase='run'; s.spin=true; } if(s.phase==='run'){ s.program='garen'; s.hubTarget = progTarget('garen'); } }
      render();
    }
  });
  setInterval(function(){
    if(!s.started) return;
    var changed = false;
    if(s.phase==='run'){
      s.angle = (s.angle + 6*s.speed*s.simSpeed) % 360;
      if(s.hubTarget!==null){
        var dh = s.hubTarget - s.hub, st = 15*s.simSpeed;
        if(Math.abs(dh)<=st){ s.hub = s.hubTarget; s.hubTarget = null; } else s.hub += dh>0 ? st : -st;
        changed = true;
      }
    }
    else if(s.phase==='finish'){
      if(s.angle<360) s.angle += 6*s.speed*s.simSpeed;
      s.hub = Math.min(300, s.hub + 15*s.simSpeed); s.program=''; changed=true;
      if(s.angle>=360 && s.hub>=300){ s.angle=0; s.phase='parked'; s.spin=false; }
    }
    if(s.burnerOn){ core += dir*2*s.simSpeed; if(core>=100){ core=100; dir=-1; } else if(core<=20){ core=20; dir=1; } } else core = Math.max(20, core-0.05);
    hist.push(core); if(hist.length>240) hist.shift();
    updateLive();
    if(changed && (s.tab!=='sys' || !document.activeElement || document.activeElement.id!=='simSl')) render();
  }, 1000);
  render();
})();
</script>
</body>
</html>
